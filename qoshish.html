<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avtomobil qo'shish — Avto Yuvish</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('cw_mavzu'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<header class="navbar no-print">
  <div class="nav-inner">
    <span class="nav-brand">Avto Yuvish</span>
    <div class="nav-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" onclick="mavzuniAlmashtir()"
        aria-label="Mavzuni almashtirish" title="Mavzuni almashtirish"></button>
      <button type="button" class="burger" id="burger" onclick="menyuniAlmashtir()"
        aria-label="Menyuni ochish" aria-expanded="false" aria-controls="nav-menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <nav class="nav-menu" id="nav-menu">
    <a href="xizmatlar.html">Xizmatlar va Narxlar</a>
    <a href="qoshish.html" class="active">Avtomobil qo'shish</a>
    <a href="bugungi.html">Bugungi avtomobillar</a>
    <a href="hisob.html">Avto Yuvish Hisobi</a>
  </nav>
</header>

<main class="page">

<div class="card no-print">
  <h2>Avtomobil qo'shish</h2>

  <label>Avtomobil modeli</label>
  <input type="text" id="model" placeholder="Chevrolet Cobalt..." list="car-models-list" autocomplete="off" />
  <datalist id="car-models-list"></datalist>

  <label>Rasm tanlang yoki kameradan oling</label>
  <input type="file" id="upload-img" accept="image/*" />

  <video id="cam-preview" autoplay playsinline muted
    style="width:100%;max-height:240px;border-radius:10px;border:1px solid var(--border);background:#000;display:none;margin-top:12px;"></video>
  <button type="button" class="btn btn-outline" onclick="startCamera()" style="margin-top:12px;">Kamerani yoqish</button>
  <button type="button" class="btn btn-primary" onclick="takePhoto()" style="margin-top:8px;">Rasmni olish va aniqlash</button>
  <canvas id="cam-canvas" style="display:none;"></canvas>

  <img id="photo-preview" alt="Tanlangan rasm"
    style="width:100%;border-radius:10px;border:1px solid var(--border);margin-top:12px;display:none;" />

  <p id="ocr-result" class="plate-hint" style="margin-top:10px;"></p>

  <label>Xizmat</label>
  <select id="service-select"></select>
  <button class="btn btn-primary" onclick="avtomobilQoshish()">Avtomobil qo'shish</button>
</div>

</main>

<script src="app.js"></script>
</body>
</html>
