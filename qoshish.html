<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avtomobil qo'shish — Avto Yuvish</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('cw_mavzu'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

<header class="navbar no-print">
  <div class="nav-inner">
    <button type="button" class="burger" id="burger" onclick="menyuniAlmashtir()"
      aria-label="Menyuni ochish" aria-expanded="false" aria-controls="nav-menu">
      <span></span><span></span><span></span>
    </button>
    <span class="nav-title">Avtomobil qo'shish</span>
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="mavzuniAlmashtir()"
      aria-label="Mavzuni almashtirish" title="Mavzuni almashtirish"></button>
  </div>
</header>

<div class="scrim no-print" id="drawer-scrim" onclick="menyuniYopish()"></div>
<aside class="drawer no-print" id="nav-menu" aria-hidden="true" aria-label="Sahifalar">
  <div class="drawer-head">
    <span class="nav-brand">Avto Yuvish</span>
    <button type="button" class="drawer-close" data-ikon="bekor" onclick="menyuniYopish()"
      aria-label="Menyuni yopish"></button>
  </div>
  <nav class="drawer-links">
    <a href="qoshish.html" class="active" data-ikon="plus">Avtomobil qo'shish</a>
    <a href="bugungi.html" data-ikon="ruyxat">Bugungi avtomobillar</a>
    <a href="hisob.html" data-ikon="chek">Avto Yuvish Hisobi</a>
    <a href="xizmatlar.html" data-ikon="teg">Xizmatlar va Narxlar</a>
  </nav>
</aside>

<main class="page">

<div class="card no-print">
  <label>Avtomobil modeli</label>
  <input type="text" id="model" placeholder="Chevrolet Cobalt..." list="car-models-list" autocomplete="off" />
  <datalist id="car-models-list"></datalist>

  <label>Rasm tanlang yoki kameradan oling</label>
  <label for="upload-img" class="btn btn-outline btn-giant file-btn" data-ikon="plus">Rasm tanlash</label>
  <input type="file" id="upload-img" class="file-input" accept="image/*" />
  <p id="file-name" class="plate-hint"></p>

  <video id="cam-preview" autoplay playsinline muted
    style="width:100%;max-height:240px;border-radius:10px;border:1px solid var(--border);background:#000;display:none;margin-top:12px;"></video>
  <button type="button" class="btn btn-outline btn-giant" onclick="startCamera()" style="margin-top:12px;">Kamerani yoqish</button>
  <button type="button" class="btn btn-primary btn-giant" onclick="takePhoto()" style="margin-top:8px;">Rasmni olish va aniqlash</button>
  <canvas id="cam-canvas" style="display:none;"></canvas>

  <img id="photo-preview" alt="Tanlangan rasm"
    style="width:100%;border-radius:10px;border:1px solid var(--border);margin-top:12px;display:none;" />

  <p id="ocr-result" class="plate-hint" style="margin-top:10px;"></p>

  <label>Xizmat — bittasini tanlang</label>
  <div class="service-cards" id="service-cards" role="radiogroup" aria-label="Xizmat tanlash"></div>
  <button class="btn btn-primary btn-giant sticky-cta" onclick="avtomobilQoshish()">Avtomobil qo'shish</button>
</div>

</main>

<script src="app.js"></script>
</body>
</html>
